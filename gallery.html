    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>

                <a href="prices.html" class="hover:text-white transition-colors">Абонементи</a>

            <div class="hidden md:flex flex-col items-end z-50">
                <a href="tel:+380959171212" class="text-xs font-bold tracking-widest hover:text-brand-red transition-colors">095 917 1212</a>
                <a href="tel:+380679172112" class="text-xs font-bold tracking-widest text-brand-muted hover:text-brand-red transition-colors">067 917 2112</a>
            </div>

            <!-- Функціональна зона / TRX -->

            <!-- Преміум роздягальня -->

            </div>
            <!-- Вбиральня -->
            <div class="aspect-square overflow-hidden border border-white/5 bg-brand-gray group">
                <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=800&q=80" alt="Вбиральня" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>
            <!-- Душова зона -->

                <img src="https://images.unsplash.com/photo-1507652313519-d4e9174996dd?auto=format&fit=crop&w=800&q=80" alt="Душові" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">

    <div class="max-w-[85rem] mx-auto px-4 sm:px-6 md:px-12 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-24 items-center reveal">

            <div class="flex flex-col space-y-10 text-left">

                    <span class="text-brand-red text-[11px] font-bold tracking-widest-xl uppercase mb-3 block">Локація</span>
                    <p class="font-display font-bold text-3xl md:text-5xl uppercase tracking-wide leading-tight">М. Харків<br>вул. 23 Серпня, 43</p>
                </div>
                <div>
                    <span class="text-brand-red text-[11px] font-bold tracking-widest-xl uppercase mb-3 block">Зв'язок</span>
                    <div class="flex flex-col gap-1">
                        <a href="tel:+380959171212" class="font-display font-bold text-3xl md:text-5xl tracking-wide hover:text-brand-red transition-colors">095 917 1212</a>

</footer>

<script>
    lucide.createIcons();
    const menuBtn = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = menuBtn.querySelector('.menu-icon');
    const closeIcon = menuBtn.querySelector('.close-icon');

    menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
        setTimeout(() => mobileMenu.classList.toggle('opacity-0'), 10);
        menuIcon.classList.toggle('hidden');
        closeIcon.classList.toggle('hidden');
        document.body.style.overflow = document.body.style.overflow === 'hidden' ? '' : 'hidden';
    });

    const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('active'); obs.unobserve(e.target); }});
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
</script>
</body>
</html>
